name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (.NET 8 / Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore QuantTrading.sln

      - name: Build (Release)
        run: dotnet build QuantTrading.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test QuantTrading.sln --configuration Release --no-build --verbosity normal
